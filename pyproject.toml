[project]
name = "nifty-behavior-engine"
version = "0.1.0"
description = "NIFTY 50 behavioral options paper-trading engine. Paper mode only; never places broker orders."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "pandas>=2.2",
    # Pinned, not floated: the generated Upstox schema module carries a runtime
    # version guard, so the runtime must not drift away from the generator.
    # Regenerate with tools/generate_upstox_proto.py after changing this.
    "protobuf==5.29.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# Only needed by tools/upstox_live_smoke.py, which is the only websocket client
# in the project. Not a runtime import for the engine.
live = [
    "websockets>=13.1",
]
# Only needed to regenerate the vendored Protobuf module; not a runtime import.
codegen = [
    "grpcio-tools==1.68.1",
    "protobuf==5.29.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "live: requires real credentials and an authorized live market session; skipped by default",
]
filterwarnings = ["error::DeprecationWarning"]
